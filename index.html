<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CarCare Service Profile</title>
</head>
<body>
    <h1>Welcome to CarCare Service</h1>

    <!-- Create / Update form -->
    <section class="panel">
        <h3 id="formTitle">Add New Profile</h3>
        <form id="profileForm">
            <input type="hidden" id="profileId">

            <label for="name">Garage Name *</label>
            <input type="text" id="name" required>

            <label for="tagline">Tagline</label>
            <input type="text" id="tagline">

            <label for="location">Location</label>
            <input type="text" id="location">

            <label for="email">Email</label>
            <input type="email" id="email">

            <label for="services">Services (separate with commas)</label>
            <input type="text" id="services" placeholder="Car Washing, Oil Change, Engine Repair">

            <div class="btn-row">
                <button type="submit" id="saveBtn" class="btn btn-primary">Save Profile</button>
                <button type="button" id="cancelBtn" class="btn btn-secondary" hidden>Cancel Edit</button>
            </div>
        </form>
        <p id="message" class="message"></p>
    </section>

    <!-- Search -->
    <section class="panel">
        <h3>Search Profiles</h3>
        <input type="text" id="searchInput" placeholder="Search by name, location, email or service...">
        <button type="button" id="clearSearchBtn" class="btn btn-secondary" hidden>Clear</button>
    </section>

    <!-- Profiles are loaded here from the API (READ) -->
    <div id="profiles"></div>

    <script src="script.js"></script>
</body>
</html>
